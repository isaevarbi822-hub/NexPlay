name: NEXPLAY checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Python syntax + API unit tests
        env:
          NEXPLAY_AUTH_SECRET: unit-test-only-secret-111111111111111111111
        run: |
          python -m compileall -q backend
          python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for filename in ("index.html","stores.html"):
              s=Path(filename).read_text(encoding="utf-8")
              scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', s)
              assert scripts, f"No inline script found in {filename}"
              Path(f'/tmp/{filename}.js').write_text('\n'.join(scripts), encoding="utf-8")
          PY
          node --check i18n.js
          node --check /tmp/index.html.js
          node --check /tmp/stores.html.js
